name: Deploy to CPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment type'
        required: true
        default: 'incremental'
        type: choice
        options:
        - incremental
        - full
        - force_all_php
      force_upload:
        description: 'Force upload all PHP files (if auto-detection fails)'
        required: false
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'

jobs:
  FTP-Deploy-Action:
    name: FTP-Deploy-Action
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2  # Get last 2 commits for diff
    # Skip build steps - just sync files directly

    - name: Determine deployment mode
      id: deploy_mode
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          DEPLOY_TYPE="${{ github.event.inputs.deployment_type }}"
        else
          DEPLOY_TYPE="incremental"
        fi

        echo "deployment_type=$DEPLOY_TYPE" >> $GITHUB_OUTPUT
        echo "🚀 Deployment mode: $DEPLOY_TYPE"

    # Skip build steps - just sync files directly

    - name: Full Deploy (Wipe & Upload)
      id: sync_deploy
      uses: nick-fields/retry@v2
      with:
        timeout_minutes: 30
        max_attempts: 2
        retry_wait_seconds: 20
        command: |
          # Install lftp
          sudo apt-get update && sudo apt-get install -y lftp

          echo "🚀 Starting Full Deployment..."
          echo "📋 Deploying to: ${{ secrets.SSH_PATH }}"
          echo "⚡ Excluding: vendor/, .env, .git, sub_domain/"

          lftp -e "
          set ftp:ssl-allow no;
          set ftp:passive-mode on;
          set net:timeout 30;
          set net:max-retries 2;
          set net:reconnect-interval-base 5;
          
          open -u ${{ secrets.SSH_USER }},${{ secrets.SSH_PASS }} ftp://${{ secrets.SSH_HOST }};
          
          # Navigate to deployment path
          cd ${{ secrets.SSH_PATH }};
          
          echo 'Syncing project (excluding vendor, sub_domain)...';
          
          # Full Mirror Sync
          # --delete: Delete remote files not in local (keeps server in sync with Git)
          # --exclude vendor/: Do NOT delete remote vendor/ and do NOT upload local vendor/ (manual upload)
          # --exclude .env: Do NOT delete remote .env (manual upload)
          # --exclude sub_domain/: Do NOT touch sub_domain folder on server (protected)
          mirror --reverse --delete --verbose --parallel=2 --exclude .git/ --exclude .env --exclude node_modules/ --exclude vendor/ --exclude sub_domain/ ./ ./;
          
          echo '✅ Full deployment completed!';
          quit
          "

    - name: Deployment Summary
      if: always()
      run: |
        if [ "${{ steps.deploy_mode.outputs.deployment_type }}" = "full" ]; then
          echo "✅ Full deployment completed!"
          echo "🔄 Future pushes will only deploy changed files."
        else
          echo "✅ Selective deployment completed!"
          echo "⚡ Only changed files were processed - no unnecessary transfers!"
        fi
        echo "🎯 Server synchronized with Git repository."
